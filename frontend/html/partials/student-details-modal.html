<div
  class="modal fade"
  id="studentDetailsModal"
  tabindex="-1"
  aria-labelledby="studentDetailsModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="studentDetailsModalLabel">Dettagli studente</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-6">
            <p class="text-muted small mb-1">Nome</p>
            <p class="fw-semibold mb-0" id="detail-student-first-name">-</p>
          </div>
          <div class="col-md-6">
            <p class="text-muted small mb-1">Cognome</p>
            <p class="fw-semibold mb-0" id="detail-student-last-name">-</p>
          </div>
          <div class="col-md-6">
            <p class="text-muted small mb-1">Email</p>
            <p class="fw-semibold mb-0" id="detail-student-email">-</p>
          </div>
          <div class="col-md-6">
            <p class="text-muted small mb-1">Telefono</p>
            <p class="fw-semibold mb-0" id="detail-student-phone">-</p>
          </div>
          <div class="col-md-6">
            <p class="text-muted small mb-1">Codice fiscale</p>
            <p class="fw-semibold mb-0" id="detail-student-cf">-</p>
          </div>
          <div class="col-md-6">
            <p class="text-muted small mb-1">Data di nascita</p>
            <p class="fw-semibold mb-0" id="detail-student-birth">-</p>
          </div>
          <div class="col-md-6">
            <p class="text-muted small mb-1">Paese</p>
            <p class="fw-semibold mb-0" id="detail-student-country">-</p>
          </div>
          <div class="col-md-6">
            <p class="text-muted small mb-1">Città</p>
            <p class="fw-semibold mb-0" id="detail-student-city">-</p>
          </div>
          <div class="col-md-6">
            <p class="text-muted small mb-1">Indirizzo</p>
            <p class="fw-semibold mb-0" id="detail-student-address">-</p>
          </div>
          <div class="col-md-6">
            <p class="text-muted small mb-1">CAP</p>
            <p class="fw-semibold mb-0" id="detail-student-cap">-</p>
          </div>
          <div class="col-md-6">
            <p class="text-muted small mb-1">Pagante</p>
            <p class="fw-semibold mb-0" id="detail-student-payer-name">-</p>
          </div>
          <div class="col-md-6">
            <p class="text-muted small mb-1">Codice fiscale pagante</p>
            <p class="fw-semibold mb-0" id="detail-student-payer-cf">-</p>
          </div>
          <div class="col-md-6">
            <p class="text-muted small mb-1">Email pagante</p>
            <p class="fw-semibold mb-0" id="detail-student-payer-email">-</p>
          </div>
          <div class="col-md-6">
            <p class="text-muted small mb-1">Telefono pagante</p>
            <p class="fw-semibold mb-0" id="detail-student-payer-phone">-</p>
          </div>
          <div class="col-md-6">
            <p class="text-muted small mb-1">Indirizzo pagante</p>
            <p class="fw-semibold mb-0" id="detail-student-payer-address">-</p>
          </div>
          <div class="col-md-6">
            <p class="text-muted small mb-1">Stato</p>
            <p class="fw-semibold mb-0" id="detail-student-status">-</p>
          </div>
          <div class="col-md-6">
            <p class="text-muted small mb-1">ID studente</p>
            <p class="fw-semibold mb-0" id="detail-student-id">-</p>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Chiudi</button>
        <button type="button" class="btn btn-primary" id="edit-student">Modifica studente</button>
      </div>
    </div>
  </div>
</div>
